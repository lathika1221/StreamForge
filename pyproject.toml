[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "streamforge"
version = "0.1.0"
description = "Event-driven e-commerce data engineering platform (Redpanda + Snowflake)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "confluent-kafka>=2.4",
    "snowflake-connector-python[pandas]>=3.12",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# dbt is intentionally not declared here: it lives in the separate .venv-dbt, pinned in
# dbt/requirements.txt (installing it into this environment downgrades python-dateutil).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests by default; infrastructure tests run explicitly with
# `-m integration` (local Redpanda) or `-m snowflake` (real Snowflake account, reads .env).
addopts = "-ra -m 'not integration and not snowflake'"
markers = [
    "integration: requires the local Redpanda stack",
    "snowflake: requires the M4 Snowflake resources and credentials in .env",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
