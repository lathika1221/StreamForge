# StreamForge CI (M9.2): lint, unit tests, dbt parse and Redpanda integration tests.
#
# Safety rules for this workflow:
# - No repository secrets and no Snowflake credentials, ever. Live Snowflake tests
#   (pytest marker `snowflake`) are excluded explicitly in every pytest command.
# - dbt only parses (no connection, no warehouse); it gets dummy, non-secret values.
# - The Redpanda broker is ephemeral: started inside the integration job and removed
#   at the end. The tests use temporary topics and consumer groups only.
# - Read-only token; third-party actions are pinned to full commit SHAs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Guard - no secrets or Snowflake credentials in workflows
        run: |
          # Bracket expressions keep these patterns from matching this step's own text.
          if grep -rnE 'secrets[.]|SNOWFLAKE_(PASSWORD|TOKEN)[[:space:]]*[:=]' .github/workflows; then
            echo "::error::workflows must not reference secrets or Snowflake passwords/tokens"
            exit 1
          fi
          if grep -rnE 'PASSPHRASE[[:space:]]*[:=]' .github/workflows | grep -v 'ci-dummy'; then
            echo "::error::the only allowed key passphrase in workflows is the ci-dummy placeholder"
            exit 1
          fi

      - name: Install (pinned by constraints.txt)
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: pip check
        run: python -m pip check

      - name: Ruff lint
        run: python -m ruff check src tests dbt/run_dbt.py

      - name: Ruff format check
        run: python -m ruff format --check src tests dbt/run_dbt.py

      - name: Unit tests
        run: python -m pytest -m "not integration and not snowflake"

  dbt-parse:
    name: dbt parse (no Snowflake connection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy, non-secret values: `dbt parse` renders the profile but never connects.
      # dbt/run_dbt.py is not used here because it requires a real private key file.
      SNOWFLAKE_ACCOUNT: ci-dummy
      SNOWFLAKE_USER: ci-dummy
      SNOWFLAKE_ROLE: STREAMFORGE_ROLE
      SNOWFLAKE_WAREHOUSE: STREAMFORGE_WH
      SNOWFLAKE_DATABASE: ECOMMERCE_STREAMING_DB
      SNOWFLAKE_PRIVATE_KEY_PATH: /nonexistent/ci-dummy.p8
      DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ci-dummy
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dbt/requirements.txt
            dbt/constraints.txt

      - name: Install dbt (isolated job, pinned by dbt/constraints.txt)
        run: python -m pip install -r dbt/requirements.txt -c dbt/constraints.txt

      - name: pip check
        run: python -m pip check

      - name: dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt

  integration:
    name: Redpanda integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install (pinned by constraints.txt)
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Start ephemeral Redpanda (repository Compose file)
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Redpanda integration tests (no Snowflake)
        run: python -m pytest -m "integration and not snowflake" --durations=0

      - name: Broker logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color redpanda redpanda-init

      - name: Remove the ephemeral broker
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
