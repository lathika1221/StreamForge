# StreamForge Kafka-path benchmark (M9.4). Manual only: Actions -> Benchmark -> Run workflow.
#
# Runs `python -m streamforge.benchmark` against an ephemeral Redpanda broker started from
# the repository's Compose file, on a standard GitHub-hosted runner. No Snowflake, no
# secrets: RAW writes go to an in-memory sink. Results appear in the job summary and as
# the `benchmark-results` artifact (JSON with the runner's environment).

name: Benchmark

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Runs per workload size"
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "5"]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Kafka-path benchmark (no Snowflake)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install (pinned by constraints.txt)
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Start ephemeral Redpanda (repository Compose file)
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Runner hardware
        run: |
          nproc
          free -m
          lscpu | grep -E "Model name|^CPU\(s\)" || true

      - name: Benchmark
        env:
          REPEATS: ${{ inputs.repeats }}
        run: >
          python -m streamforge.benchmark
          --events 2000 10000 --batch-sizes 100 500
          --repeats "$REPEATS" --json benchmark-results.json

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

      - name: Remove the ephemeral broker
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
